name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:
    types:
      - checks_requested

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: every job, including ones running code from automated PRs, gets a read-only
# token unless it asks for more (supply-chain does, for the reusable OSV workflow).
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Lint files
        run: yarn lint

      - name: Typecheck files
        run: yarn typecheck

      - name: Unused files, exports and dependencies (knip)
        run: yarn knip

      - name: Native contract is generated from the Codegen spec
        run: yarn contract --check

      - name: Unit tests (library contract, diagnostics, Expo plugin)
        run: yarn test --ci

      - name: Script tests (native contract, measurement parsing)
        run: yarn test:scripts

      - name: Lint Kotlin (ktlint, checksum-pinned)
        run: |
          curl -sSfL -o /tmp/ktlint https://github.com/pinterest/ktlint/releases/download/1.8.0/ktlint
          echo "a3fd620207d5c40da6ca789b95e7f823c54e854b7fade7f613e91096a3706d75  /tmp/ktlint" | sha256sum -c -
          chmod +x /tmp/ktlint
          /tmp/ktlint "android/src/**/*.kt" "!android/src/main/java/com/remotecompose/contract/**" "tools/remote-compose-json/**/*.kt" "tools/remote-compose-json/*.kts"

      - name: Static analysis for Kotlin (detekt, checksum-pinned, new findings only)
        # Maven Central's artifact and the sha256 Central publishes for it. Pre-existing findings
        # are in detekt-baseline.xml.
        run: |
          curl -sSfL -o /tmp/detekt.jar https://repo1.maven.org/maven2/io/gitlab/arturbosch/detekt/detekt-cli/1.23.8/detekt-cli-1.23.8-all.jar
          echo "3afe89a11120303c73c9bdda3d8fe558dd9070a6937d27819ddc04b275381245  /tmp/detekt.jar" | sha256sum -c -
          java -jar /tmp/detekt.jar --build-upon-default-config --config detekt.yml --baseline detekt-baseline.xml --input android/src,tools/remote-compose-json/src --excludes '**/contract/**'

      - name: Format Swift (SwiftFormat --lint, checksum-pinned)
        # The formatter lefthook runs before each commit, so a commit made without hooks is caught too.
        run: |
          curl -sSfL -o /tmp/swiftformat.zip https://github.com/nicklockwood/SwiftFormat/releases/download/0.64.7/swiftformat_linux.zip
          echo "819aea026e1c630f46b234ed84481e56d9eb3cfe7024cd51b1af55169c8e13bb  /tmp/swiftformat.zip" | sha256sum -c -
          unzip -q -o /tmp/swiftformat.zip -d /tmp/swiftformat
          /tmp/swiftformat/swiftformat_linux --lint ios

      - name: Lint Swift (SwiftLint, checksum-pinned)
        # The statically linked Linux build runs on this runner without a Swift toolchain. It skips
        # the few rules that need SourceKit (statement_position; SwiftFormat covers that one).
        run: |
          curl -sSfL -o /tmp/swiftlint.zip https://github.com/realm/SwiftLint/releases/download/0.65.1/swiftlint_linux_amd64.zip
          echo "caeed6f4a679c35539ffaf124f6c4ab4a8416917f7d8796279dc52b74026059d  /tmp/swiftlint.zip" | sha256sum -c -
          unzip -q -o /tmp/swiftlint.zip -d /tmp/swiftlint
          /tmp/swiftlint/swiftlint-static lint --strict --no-cache

  secrets:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # every commit, not only the tip: a secret removed later is still leaked

      - name: Scan the git history for secrets (gitleaks, checksum-pinned)
        # The CLI, pinned like the other tools; gitleaks-action needs a license key on organisation repos.
        run: |
          curl -sSfL -o /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git --no-banner --redact --config .gitleaks.toml .

  supply-chain:
    # Google's reusable workflow (the action alone is not meant to be used directly). No SARIF
    # upload: Code Scanning needs GitHub Advanced Security on a private repository.
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
    permissions:
      actions: read
      contents: read
      security-events: write
    with:
      upload-sarif: false
      fail-on-vuln: true
      scan-args: |-
        --config=osv-scanner.toml
        --lockfile=yarn.lock
        --lockfile=example/Gemfile.lock

  native-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Gradle wrapper jars are Gradle's own
        # Every gradle-wrapper.jar in the repo (including ones an automated PR changes) must match a
        # checksum Gradle published, or the build stops before running it.
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Install JDK
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Converter tests (JSON -> .rc, renderability gate)
        run: tools/remote-compose-json/gradlew -p tools/remote-compose-json test installDist --console=plain

      - name: Demo documents are up to date with their JSON
        run: |
          yarn documents
          git diff --exit-code -- example-shared/documents/rc

      - name: Android unit tests (host value resolution) and Android Lint (new findings only)
        # Lint's pre-existing findings are in android/lint-baseline.xml.
        run: example/android/gradlew -p example/android :react-native-remote-compose:testDebugUnitTest :react-native-remote-compose:lintDebug --console=plain

  build-library:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build package
        run: yarn prepare

  build-android:
    runs-on: ubuntu-latest

    env:
      TURBO_CACHE_DIR: .turbo/android

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Cache turborepo for Android
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TURBO_CACHE_DIR }}
          key: ${{ runner.os }}-turborepo-android-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-turborepo-android-

      - name: Check turborepo cache for Android
        run: |
          # Skip only when every demo's build:android is cached.
          TURBO_CACHE_STATUS=$(node -p "($(yarn turbo run build:android --cache-dir="${{ env.TURBO_CACHE_DIR }}" --dry=json)).tasks.filter(t => t.task === 'build:android' && t.command !== '<NONEXISTENT>').every(t => t.cache.status === 'HIT') ? 'HIT' : 'MISS'")

          if [[ $TURBO_CACHE_STATUS == "HIT" ]]; then
            echo "turbo_cache_hit=1" >> $GITHUB_ENV
          fi

      - name: Install JDK
        if: env.turbo_cache_hit != 1
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Finalize Android SDK
        if: env.turbo_cache_hit != 1
        run: |
          /bin/bash -c "yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null"
          # The runner image can carry an incomplete NDK directory, which AGP then refuses
          # ("did not have a source.properties file"); install the version React Native asks for.
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.1.12297006" > /dev/null


      - name: Cache Gradle
        if: env.turbo_cache_hit != 1
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('example/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build example for Android
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx6g"
        run: |
          # One demo at a time: both build the library into its own android/ build directory.
          yarn turbo run build:android --cache-dir="${{ env.TURBO_CACHE_DIR }}" --concurrency=1

  build-ios:
    runs-on: macos-latest

    env:
      XCODE_VERSION: 26
      TURBO_CACHE_DIR: .turbo/ios
      RCT_USE_RN_DEP: 1
      RCT_USE_PREBUILT_RNCORE: 1

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Cache turborepo for iOS
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TURBO_CACHE_DIR }}
          key: ${{ runner.os }}-turborepo-ios-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-turborepo-ios-

      - name: Check turborepo cache for iOS
        run: |
          # Skip only when every demo's build:ios is cached.
          TURBO_CACHE_STATUS=$(node -p "($(yarn turbo run build:ios --cache-dir="${{ env.TURBO_CACHE_DIR }}" --dry=json)).tasks.filter(t => t.task === 'build:ios' && t.command !== '<NONEXISTENT>').every(t => t.cache.status === 'HIT') ? 'HIT' : 'MISS'")

          if [[ $TURBO_CACHE_STATUS == "HIT" ]]; then
            echo "turbo_cache_hit=1" >> $GITHUB_ENV
          fi

      - name: Use appropriate Xcode version
        if: env.turbo_cache_hit != 1
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Install cocoapods
        if: env.turbo_cache_hit != 1
        env:
          BUNDLE_FROZEN: 'true' # a Gemfile.lock that would change fails the build
        run: |
          cd example
          bundle install
          bundle exec pod install --project-directory=ios

      - name: Build example for iOS
        run: |
          # One demo at a time: both build the library into its own android/ build directory.
          yarn turbo run build:ios --cache-dir="${{ env.TURBO_CACHE_DIR }}" --concurrency=1

      - name: Swift unit tests (XCTest)
        if: env.turbo_cache_hit != 1
        run: |
          # The first available iPhone simulator, whatever the runner image ships.
          SIMULATOR=$(xcrun simctl list devices available --json | node -p "Object.values(JSON.parse(require('fs').readFileSync(0)).devices).flat().find(d => d.name.startsWith('iPhone')).udid")
          xcodebuild test \
            -workspace example/ios/RemoteComposeExample.xcworkspace \
            -scheme RemoteCompose-Unit-Tests \
            -destination "platform=iOS Simulator,id=$SIMULATOR" \
            -derivedDataPath example/ios/build

