name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:
    types:
      - checks_requested

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: every job, including ones running code from automated PRs, gets a read-only
# token unless it asks for more (supply-chain does, for the reusable OSV workflow).
permissions:
  contents: read

jobs:
  # Decides whether the change can affect the iOS build, so build-ios (macOS: scarce, slow runners)
  # runs only when it can. Conservative: see scripts/ios-affected.ts. A skipped job does not fail
  # the run, so the release gate (CI passed for the tagged commit) is unaffected; a release commit
  # changes package.json and always builds iOS.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ios: ${{ steps.ios.outputs.ios }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Can the change affect the iOS build?
        id: ios
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT" in
            pull_request) node scripts/ios-affected.ts "$PR_BASE" "$PR_HEAD" ;;
            push) node scripts/ios-affected.ts "$PUSH_BEFORE" "$GITHUB_SHA" ;;
            *) echo "ios=true" | tee -a "$GITHUB_OUTPUT" ;; # merge queue and anything else: build
          esac

  lint:
    runs-on: ubuntu-latest

    # Downloaded linters: one place for each version and the sha256 of its release file. Each is
    # cached under its checksum and checked on every run, cached or not (.github/actions/fetch-tool).
    env:
      KTLINT_VERSION: 1.8.0
      KTLINT_SHA256: a3fd620207d5c40da6ca789b95e7f823c54e854b7fade7f613e91096a3706d75
      DETEKT_VERSION: 1.23.8
      DETEKT_SHA256: 3afe89a11120303c73c9bdda3d8fe558dd9070a6937d27819ddc04b275381245
      SWIFTFORMAT_VERSION: 0.64.7
      SWIFTFORMAT_SHA256: 819aea026e1c630f46b234ed84481e56d9eb3cfe7024cd51b1af55169c8e13bb
      SWIFTLINT_VERSION: 0.65.1
      SWIFTLINT_SHA256: caeed6f4a679c35539ffaf124f6c4ab4a8416917f7d8796279dc52b74026059d

    # The tools are fetched first, so a download saved to the cache is kept whatever fails later.
    # The JDK, every fetch and every check run even when an earlier step failed (`!cancelled()`),
    # so one run reports every failing check; a check skips only when what it needs did not
    # install (the yarn dependencies, the JDK or its tool).
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        id: setup
        uses: ./.github/actions/setup

      - name: Install JDK (ktlint, detekt)
        id: jdk
        if: ${{ !cancelled() }}
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Fetch ktlint
        id: ktlint
        if: ${{ !cancelled() }}
        uses: ./.github/actions/fetch-tool
        with:
          name: ktlint
          url: https://github.com/pinterest/ktlint/releases/download/${{ env.KTLINT_VERSION }}/ktlint
          sha256: ${{ env.KTLINT_SHA256 }}

      - name: Fetch detekt
        # Maven Central's artifact and the sha256 Central publishes for it.
        id: detekt
        if: ${{ !cancelled() }}
        uses: ./.github/actions/fetch-tool
        with:
          name: detekt-cli.jar
          url: https://repo1.maven.org/maven2/io/gitlab/arturbosch/detekt/detekt-cli/${{ env.DETEKT_VERSION }}/detekt-cli-${{ env.DETEKT_VERSION }}-all.jar
          sha256: ${{ env.DETEKT_SHA256 }}

      - name: Fetch SwiftFormat
        id: swiftformat
        if: ${{ !cancelled() }}
        uses: ./.github/actions/fetch-tool
        with:
          name: swiftformat
          url: https://github.com/nicklockwood/SwiftFormat/releases/download/${{ env.SWIFTFORMAT_VERSION }}/swiftformat_linux.zip
          sha256: ${{ env.SWIFTFORMAT_SHA256 }}
          archive-path: swiftformat_linux

      - name: Fetch SwiftLint
        # The statically linked Linux build runs on this runner without a Swift toolchain.
        id: swiftlint
        if: ${{ !cancelled() }}
        uses: ./.github/actions/fetch-tool
        with:
          name: swiftlint
          url: https://github.com/realm/SwiftLint/releases/download/${{ env.SWIFTLINT_VERSION }}/swiftlint_linux_amd64.zip
          sha256: ${{ env.SWIFTLINT_SHA256 }}
          archive-path: swiftlint-static

      - name: Lint files
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: yarn lint

      - name: Typecheck files
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: yarn typecheck

      - name: Unused files, exports and dependencies (knip)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: yarn knip

      - name: Native contract is generated from the Codegen spec
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: yarn contract --check

      - name: Expo demo dependencies match its Expo SDK (expo install --check, offline)
        # Offline: checks against the SDK's own bundledNativeModules.json, so the result changes only
        # with a change here. Online it would ask Expo's API for the newest patch releases, which can
        # be younger than .yarnrc.yml's 7-day npmMinimalAgeGate and so not installable yet.
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        env:
          EXPO_OFFLINE: '1'
        run: yarn workspace react-native-remote-compose-example-expo expo install --check

      - name: Unit tests (library contract, diagnostics, Expo plugin)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: yarn test --ci

      - name: Script tests (native contract, measurement parsing, version copies, downloads)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: yarn test:scripts

      - name: Lint Kotlin (ktlint)
        if: ${{ !cancelled() && steps.jdk.outcome == 'success' && steps.ktlint.outcome == 'success' }}
        run: ktlint "android/src/**/*.kt" "!android/src/main/java/com/remotecompose/contract/**" "tools/remote-compose-json/**/*.kt" "tools/remote-compose-json/*.kts"

      - name: Static analysis for Kotlin (detekt)
        # No baseline: a finding is fixed or suppressed where it is, with the reason.
        if: ${{ !cancelled() && steps.jdk.outcome == 'success' && steps.detekt.outcome == 'success' }}
        env:
          DETEKT_JAR: ${{ steps.detekt.outputs.path }}
        run: java -jar "$DETEKT_JAR" --build-upon-default-config --config detekt.yml --input android/src,tools/remote-compose-json/src --excludes '**/contract/**'

      - name: Format Swift (SwiftFormat --lint)
        # The formatter lefthook runs before each commit, so a commit made without hooks is caught too.
        if: ${{ !cancelled() && steps.swiftformat.outcome == 'success' }}
        run: swiftformat --lint ios

      - name: Lint Swift (SwiftLint)
        # The static build skips the few rules that need SourceKit (statement_position; SwiftFormat
        # covers that one).
        if: ${{ !cancelled() && steps.swiftlint.outcome == 'success' }}
        run: swiftlint lint --strict --no-cache

  secrets:
    runs-on: ubuntu-latest

    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # every commit, not only the tip: a secret removed later is still leaked

      - name: Setup Node.js (fetch-tool)
        # Node only: the fetch-tool script needs no dependencies, so no yarn install here.
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Fetch gitleaks
        # The CLI, pinned like the other tools; gitleaks-action needs a license key on organisation repos.
        uses: ./.github/actions/fetch-tool
        with:
          name: gitleaks
          url: https://github.com/gitleaks/gitleaks/releases/download/v${{ env.GITLEAKS_VERSION }}/gitleaks_${{ env.GITLEAKS_VERSION }}_linux_x64.tar.gz
          sha256: ${{ env.GITLEAKS_SHA256 }}
          archive-path: gitleaks

      - name: Scan the git history for secrets (gitleaks)
        # --log-opts: HEAD limits the scan to the checked-out commit's history (without it gitleaks
        # runs `git log --all`, and fetch-depth 0 fetches every branch, so a key on any stale branch
        # would fail every run); --diff-merges=separate also scans what a merge commit adds itself
        # (a conflict resolution), which plain `git log -p` skips.
        run: gitleaks git --no-banner --redact --config .gitleaks.toml --log-opts="--diff-merges=separate HEAD" .

  supply-chain:
    # Google's reusable workflow (the action alone is not meant to be used directly). No SARIF
    # upload: Code Scanning needs GitHub Advanced Security on a private repository.
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
    permissions:
      actions: read
      contents: read
      security-events: write
    with:
      upload-sarif: false
      fail-on-vuln: true
      scan-args: |-
        --config=osv-scanner.toml
        --lockfile=yarn.lock
        --lockfile=example/Gemfile.lock
        --lockfile=example/android/app/gradle.lockfile
        --lockfile=tools/remote-compose-json/gradle.lockfile

  native-tests:
    runs-on: ubuntu-latest

    # The lockfile check and the Android step run even when an earlier check failed, so one run
    # reports all of them; they still skip when the wrapper validation, setup or JDK did not pass
    # (the JDK step runs only after both). The documents step builds and runs the converter the
    # first step tests, so it keeps the default and skips after a converter failure.

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Gradle wrapper jars are Gradle's own
        # Every gradle-wrapper.jar in the repo (including ones an automated PR changes) must match a
        # checksum Gradle published, or the build stops before running it.
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Install JDK
        id: jdk
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Converter tests (JSON -> .rc, renderability gate)
        run: tools/remote-compose-json/gradlew -p tools/remote-compose-json test installDist --console=plain

      - name: Gradle lockfiles match the dependencies
        # The lockfiles are what OSV-Scanner (supply-chain) scans: a lock that no longer matches the
        # declared dependencies would hide a downgrade or a removed library and scan versions that do
        # not ship. Rewrite both and fail on any difference.
        if: ${{ !cancelled() && steps.jdk.outcome == 'success' }}
        run: |
          tools/remote-compose-json/gradlew -p tools/remote-compose-json dependencies --write-locks --console=plain > /dev/null
          example/android/gradlew -p example/android :app:dependencies --configuration releaseRuntimeClasspath --write-locks --console=plain > /dev/null
          git diff --exit-code -- tools/remote-compose-json/gradle.lockfile example/android/app/gradle.lockfile

      - name: Demo documents are up to date with their JSON
        # A changed .rc fails, and so does a new one that is not committed (a demo JSON added
        # without its .rc): `git diff` alone does not see untracked files.
        run: |
          yarn documents
          git diff --exit-code -- example-shared/documents/rc
          untracked=$(git status --porcelain -- example-shared/documents/rc)
          if [ -n "$untracked" ]; then
            echo "::error::Generated .rc files are not committed; run yarn documents and commit them:"
            echo "$untracked"
            exit 1
          fi

      - name: Android unit tests (host value resolution) and Android Lint
        # No lint baseline: any finding fails. remoteComposeStrictLint makes warnings fail here only;
        # apps that lint the library keep lint's default (errors only).
        # --continue: lint runs and reports even when a unit test fails (lint does not depend on the
        # tests), and the step still fails on either.
        if: ${{ !cancelled() && steps.jdk.outcome == 'success' }}
        run: example/android/gradlew -p example/android :react-native-remote-compose:testDebugUnitTest :react-native-remote-compose:lintDebug -PremoteComposeStrictLint=true --continue --console=plain

  build-library:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build package
        run: yarn prepare

  build-android:
    runs-on: ubuntu-latest

    env:
      TURBO_CACHE_DIR: .turbo/android

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Cache turborepo for Android
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TURBO_CACHE_DIR }}
          key: ${{ runner.os }}-turborepo-android-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-turborepo-android-

      - name: Check turborepo cache for Android
        run: |
          # Skip only when every demo's build:android is cached.
          TURBO_CACHE_STATUS=$(node -p "($(yarn turbo run build:android --cache-dir="${{ env.TURBO_CACHE_DIR }}" --dry=json)).tasks.filter(t => t.task === 'build:android' && t.command !== '<NONEXISTENT>').every(t => t.cache.status === 'HIT') ? 'HIT' : 'MISS'")

          if [[ $TURBO_CACHE_STATUS == "HIT" ]]; then
            echo "turbo_cache_hit=1" >> "$GITHUB_ENV"
          fi

      - name: Install JDK
        if: env.turbo_cache_hit != 1
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Finalize Android SDK
        if: env.turbo_cache_hit != 1
        run: |
          /bin/bash -c "yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null"
          # The runner image can carry an incomplete NDK directory, which AGP then refuses
          # ("did not have a source.properties file"); install the version React Native asks for.
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.1.12297006" > /dev/null


      - name: Cache Gradle
        if: env.turbo_cache_hit != 1
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('example/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build example for Android
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx6g"
        run: |
          # One demo at a time: both build the library into its own android/ build directory.
          yarn turbo run build:android --cache-dir="${{ env.TURBO_CACHE_DIR }}" --concurrency=1

  build-ios:
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-latest

    env:
      XCODE_VERSION: 26
      TURBO_CACHE_DIR: .turbo/ios
      RCT_USE_RN_DEP: 1
      RCT_USE_PREBUILT_RNCORE: 1

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Cache turborepo for iOS
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TURBO_CACHE_DIR }}
          key: ${{ runner.os }}-turborepo-ios-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-turborepo-ios-

      - name: Check turborepo cache for iOS
        run: |
          # Skip only when every demo's build:ios is cached.
          TURBO_CACHE_STATUS=$(node -p "($(yarn turbo run build:ios --cache-dir="${{ env.TURBO_CACHE_DIR }}" --dry=json)).tasks.filter(t => t.task === 'build:ios' && t.command !== '<NONEXISTENT>').every(t => t.cache.status === 'HIT') ? 'HIT' : 'MISS'")

          if [[ $TURBO_CACHE_STATUS == "HIT" ]]; then
            echo "turbo_cache_hit=1" >> "$GITHUB_ENV"
          fi

      - name: Use appropriate Xcode version
        if: env.turbo_cache_hit != 1
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Install cocoapods
        if: env.turbo_cache_hit != 1
        env:
          BUNDLE_FROZEN: 'true' # a Gemfile.lock that would change fails the build
        run: |
          cd example
          bundle install
          bundle exec pod install --project-directory=ios

      - name: Build example for iOS
        run: |
          # One demo at a time: both build the library into its own android/ build directory.
          yarn turbo run build:ios --cache-dir="${{ env.TURBO_CACHE_DIR }}" --concurrency=1

      - name: Swift unit tests (XCTest)
        if: env.turbo_cache_hit != 1
        run: |
          # The first available iPhone simulator, whatever the runner image ships.
          SIMULATOR=$(xcrun simctl list devices available --json | node -p "Object.values(JSON.parse(require('fs').readFileSync(0)).devices).flat().find(d => d.name.startsWith('iPhone')).udid")
          xcodebuild test \
            -workspace example/ios/RemoteComposeExample.xcworkspace \
            -scheme RemoteCompose-Unit-Tests \
            -destination "platform=iOS Simulator,id=$SIMULATOR" \
            -derivedDataPath example/ios/build

