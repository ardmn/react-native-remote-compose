# One weekly pull request with every dependency update across all ecosystems, so CI runs once.
# Cooldown matches .yarnrc.yml's npmMinimalAgeGate: a release is proposed only after a week.
version: 2

multi-ecosystem-groups:
  all-dependencies:
    schedule:
      interval: weekly
    labels: ["dependencies"]

updates:
  - package-ecosystem: npm
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: all-dependencies
    cooldown: { default-days: 7 }
    versioning-strategy: increase
    ignore:
      # Pinned by React Native / Expo, which ship and test an exact set: these move together
      # with a React Native or Expo SDK upgrade, never on their own.
      - dependency-name: "react"
      - dependency-name: "react-test-renderer"
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "react-native"
      - dependency-name: "@react-native/*"
      - dependency-name: "@react-native-community/cli*"
      - dependency-name: "expo"
      - dependency-name: "expo-*"
      - dependency-name: "react-native-safe-area-context"
      # Majors React Native's toolchain does not support yet: @react-native/eslint-config accepts
      # ESLint 8–9, @react-native/babel-preset needs Babel 7, and Node types follow the Node we run
      # (.nvmrc, 24).
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@babel/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: gradle
    # Both directories read android/gradle/libs.versions.toml, the catalog that owns the AndroidX
    # Remote Compose and rc-players versions (/android directly, the CLI through its import), so one
    # grouped pull request bumps it. A bump also needs the copies `yarn lint` checks and the
    # example app's Gradle lockfile (Dependabot may rewrite the CLI's lockfile itself); CI fails
    # until they are updated (CONTRIBUTING.md, "Bumping AndroidX Remote Compose or rc-players").
    directories: ["/android", "/tools/remote-compose-json"]
    patterns: ["*"]
    multi-ecosystem-group: all-dependencies
    cooldown: { default-days: 7 }
    ignore:
      # Compose Multiplatform follows the release rc-player-compose is built against; it moves with
      # rc-players, never on its own (`yarn lint` checks it against the example's lockfile).
      - dependency-name: "org.jetbrains.compose*"

  - package-ecosystem: bundler
    directory: /example
    patterns: ["*"]
    multi-ecosystem-group: all-dependencies
    cooldown: { default-days: 7 }
    ignore:
      # cocoapods-core requires activesupport < 8 (see Gemfile and osv-scanner.toml).
      - dependency-name: "activesupport"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: all-dependencies
    cooldown: { default-days: 7 }
