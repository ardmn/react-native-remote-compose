buildscript {
  // The Compose compiler plugin must match the Kotlin Gradle plugin the app resolves.
  def kotlinVersion = rootProject.ext.has("kotlinVersion") ? rootProject.ext.get("kotlinVersion") : "2.3.21"
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath "org.jetbrains.kotlin:compose-compiler-gradle-plugin:${kotlinVersion}"
  }
}

// The versions the library ships with (shared with the JSON CLI) live in gradle/libs.versions.toml,
// a version catalog Dependabot reads. This build is applied inside the app's build, where only the
// app's root build can declare a catalog, so it reads the file itself: [versions] entries
// (`name = "1.0"`) and [libraries] entries (`alias = { module = "group:name", version.ref = "name" }`).
def catalogFile = file("gradle/libs.versions.toml")
def catalogVersions = [:]
def catalogLibraries = [:]
def catalogSection = null
catalogFile.eachLine { line, number ->
  def text = line.replaceFirst(/^\uFEFF/, "").trim()
  if (text.isEmpty() || text.startsWith("#")) return
  def header = text =~ /^\[([A-Za-z0-9_.-]+)\]$/
  if (header.matches()) {
    catalogSection = header.group(1)
    return
  }
  def version = text =~ /^([A-Za-z0-9_-]+)\s*=\s*"([^"]+)"$/
  def library = text =~ /^([A-Za-z0-9_-]+)\s*=\s*\{\s*module\s*=\s*"([^":]+:[^":]+)"\s*,\s*version\.ref\s*=\s*"([A-Za-z0-9_-]+)"\s*\}$/
  if (catalogSection == "versions" && version.matches()) {
    catalogVersions[version.group(1)] = version.group(2)
  } else if (catalogSection == "libraries" && library.matches()) {
    catalogLibraries[library.group(1)] = [module: library.group(2), versionRef: library.group(3)]
  } else {
    throw new GradleException("${catalogFile}:${number}: android/build.gradle cannot read this line: ${line}")
  }
}
def catalogVersion = { name ->
  def value = catalogVersions[name]
  if (value == null) {
    throw new GradleException("[versions] ${name} is missing from ${catalogFile}")
  }
  return value
}

ext.RemoteCompose = [
  minSdkVersion: 24,
  compileSdkVersion: 37,
]

ext.getExtOrDefault = { prop ->
  if (rootProject.ext.has(prop)) {
    return rootProject.ext.get(prop)
  }

  return RemoteCompose[prop]
}

// "group:name:version" for a catalog library. The version is the app's `<version.ref>Version` ext
// property when it sets one (androidxRemoteVersion, rcPlayersVersion, composeMultiplatformVersion),
// else the catalog's.
def catalogLibrary = { alias ->
  def library = catalogLibraries[alias]
  if (library == null) {
    throw new GradleException("[libraries] ${alias} is missing from ${catalogFile}")
  }
  def override = "${library.versionRef}Version"
  def version = rootProject.ext.has(override) ? rootProject.ext.get(override) : catalogVersion(library.versionRef)
  return "${library.module}:${version}"
}

apply plugin: "com.android.library"

if (project.extensions.findByName("kotlin") == null) {
  apply plugin: "kotlin-android"
}

apply plugin: "org.jetbrains.kotlin.plugin.compose"
apply plugin: "com.facebook.react"

android {
  namespace "com.remotecompose"

  compileSdkVersion getExtOrDefault("compileSdkVersion")

  defaultConfig {
    minSdkVersion getExtOrDefault("minSdkVersion")
  }

  buildFeatures {
    compose true
  }

  lint {
    // This file ships in the npm package, so an app running `./gradlew lint` (or check/build) lints
    // the library with this block and its own AGP's checks. By default only errors fail, as lint
    // does out of the box: a warning a newer lint adds must not break an app's build. This repo's CI
    // passes -PremoteComposeStrictLint=true, so any new finding fails here, warnings included.
    abortOnError true
    def strictLint = (project.findProperty("remoteComposeStrictLint") ?: "false").toString().toBoolean()
    warningsAsErrors strictLint
    // In strict mode only: checks whose result changes without any change here (they compare against
    // what is published today — Maven, Google's SDK Index, AGP releases — or against the date). An
    // app linting the library keeps them, so a dependency the SDK Index flags still warns there.
    if (strictLint) disable += [
      "GradleDependency",
      "NewerVersionAvailable",
      "AndroidGradlePluginVersion",
      "OldTargetApi",
      "ExpiredTargetSdkVersion",
      "ExpiringTargetSdkVersion",
      "OutdatedLibrary",
      "RiskyLibrary",
      "PlaySdkIndexNonCompliant",
      "PlaySdkIndexVulnerability",
      "PlaySdkIndexGenericIssues",
      "PlaySdkIndexDeprecated",
    ]
    // No baseline: a finding is fixed, or suppressed where it is (@SuppressLint) with the reason.
  }
}

dependencies {
  implementation "com.facebook.react:react-android"

  // The player: rc-players' Compose Multiplatform renderer (the same one the iOS side ships).
  implementation catalogLibrary("rc-player-compose")
  implementation catalogLibrary("compose-foundation")
  // AndroidX's authoring-JSON parser (RemoteComposeJsonParser), for `{ json }` sources. It is
  // AndroidX-internal (@RestrictTo): the README ("Authoring documents") says what that means for apps.
  implementation catalogLibrary("remote-creation-core")

  testImplementation "junit:junit:4.13.2"
}
