# Versions shared by the library (android/build.gradle) and the JSON CLI
# (tools/remote-compose-json/build.gradle.kts): the one place to bump them for Android and the CLI.
# Dependabot does not read this file; bump by hand. rcPlayersVersion is also pinned for iOS in
# RemoteCompose.podspec (rc_players_version), example/ios/.../swiftpm/Package.resolved and the
# fixtures URL in example-shared/src/documents.ts; the README names the tested androidxRemoteVersion.
# CONTRIBUTING.md ("Bumping AndroidX Remote Compose or rc-players") has the full list.
#
# These are the library's defaults. An app can override them with `rootProject.ext` properties of
# the same name; that changes only what the app builds against, not the CLI, which always uses the
# versions below.

# AndroidX Remote Compose: remote-creation-core supplies RemoteComposeJsonParser (`{ json }`).
androidxRemoteVersion=1.0.0-alpha23
# rc-players: the player (rc-player-compose) and its document reader (rc-player-edit).
rcPlayersVersion=3.8.0
