# Git hooks. Install once per clone: `yarn lefthook install`.
commit-msg:
  commands:
    commitlint:
      run: yarn commitlint --edit {1}

pre-commit:
  parallel: true
  commands:
    lint:
      glob: "*.{js,ts,tsx}"
      run: yarn eslint {staged_files}
    types:
      glob: "*.{ts,tsx}"
      run: yarn typecheck
    kotlin:
      glob: "*.{kt,kts}"
      run: ktlint {staged_files}
    swift:
      glob: "*.swift"
      run: swiftformat --lint {staged_files}
    objc:
      glob: "*.{h,mm,m}"
      run: clang-format --dry-run --Werror {staged_files}
