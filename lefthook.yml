# Git hooks. Install once per clone: `yarn lefthook install`.
commit-msg:
  commands:
    commitlint:
      run: yarn commitlint --edit {1}

pre-commit:
  parallel: true
  commands:
    lint:
      glob: "*.{js,ts,tsx}"
      # --no-warn-ignored: a staged file under an ESLint-ignored path (tools/, build/) is skipped
      # instead of warning "File ignored", which --max-warnings 0 would turn into a failure.
      run: yarn eslint --max-warnings 0 --no-warn-ignored {staged_files}
    types:
      glob: "*.{ts,tsx}"
      run: yarn typecheck
    # Generated by `yarn contract` and checked by `contract` below, not formatted.
    kotlin:
      glob: "*.{kt,kts}"
      exclude: ["android/src/main/java/com/remotecompose/contract/**"]
      run: ktlint {staged_files}
    swift:
      glob: "*.swift"
      exclude: ["ios/Contract/**"]
      run: swiftformat --lint {staged_files}
    objc:
      glob: "*.{h,mm,m}"
      exclude: ["ios/Contract/**"]
      run: clang-format --dry-run --Werror {staged_files}
    contract:
      glob: "src/RemoteComposeViewNativeComponent.ts"
      run: yarn contract --check
