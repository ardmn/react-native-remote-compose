nodeLinker: node-modules
nmHoistingLimits: workspaces

yarnPath: .yarn/releases/yarn-4.18.1.cjs

# --- Supply-chain hardening -------------------------------------------------
# `yarn add` writes exact versions; every package.json pins exact versions.
defaultSemverRangePrefix: ""
# Never resolve a version published less than 7 days ago: most hijacked releases are
# detected and unpublished within hours. Value in minutes.
npmMinimalAgeGate: 10080
# Install scripts (postinstall & co.) are the usual payload of a compromised package.
# None of our dependencies needs one to work; allow-list here if that ever changes.
enableScripts: false
# A tarball whose checksum differs from yarn.lock aborts the install.
checksumBehavior: throw
# Only the public registry, over TLS.
npmRegistryServer: "https://registry.npmjs.org"
enableStrictSsl: true
# Fail on telemetry noise, not on network quirks.
enableTelemetry: false
