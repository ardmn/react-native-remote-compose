# Known vulnerabilities reviewed and accepted, each with a reason and an expiry date after which
# the scanner reports it again. Anything not listed fails CI.

[[IgnoredVulns]]
id = "GHSA-3g3m-2fjr-6pw4"
ignoreUntil = 2027-02-17
reason = """glob <14.0.2 (AbortSignal timeout bypass during traversal). Dev tooling only: pulled in by
Jest (@jest/reporters, jest-config) to find test files in this repository; never shipped in the
library or the apps. Upgrading needs Jest to move to glob 14."""

[[IgnoredVulns]]
id = "GHSA-g3hv-75wg-m249"
ignoreUntil = 2027-02-17
reason = """minimatch <11.0.1 (DoS via crafted glob pattern). Dev tooling only: ESLint, typescript-eslint
and Expo CLI match patterns we write ourselves; never shipped in the library or the apps."""

[[IgnoredVulns]]
id = "GHSA-8474-xrp6-wh69"
ignoreUntil = 2027-02-17
reason = """activesupport < 8.0.5.2 (DoS via safe_constantize on attacker-controlled input). iOS build
tooling only (example/Gemfile.lock, a CocoaPods dependency), run on developer machines and CI over
our own Podfile; never shipped in the library or the apps. Not fixable today: every release of
cocoapods-core (1.17.0 included) requires activesupport < 8, and Rails has no 7.x fix."""

[[IgnoredVulns]]
id = "GHSA-fc5q-39xc-vjpf"
ignoreUntil = 2027-02-17
reason = """picomatch through 4.0.7 (ReDoS through repeated extglobs such as +(*) in the pattern). Dev
tooling only: Metro, Expo CLI, Jest and @parcel/watcher match glob patterns from our own config;
none takes a pattern from outside, and none is shipped in the library or the apps. No fixed
release exists yet (4.0.7 is the latest); remove this once one does."""
